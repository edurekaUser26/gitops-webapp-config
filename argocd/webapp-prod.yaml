---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-prod
  namespace: argocd
spec:
  project: webapp-team
  source:
    repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
    targetRevision: HEAD
    path: apps/webapp-kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-prod
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true