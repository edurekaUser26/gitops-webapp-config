---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
    targetRevision: HEAD
    path: apps/webapp
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: webapp
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true