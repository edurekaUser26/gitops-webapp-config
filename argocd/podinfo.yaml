---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/stefanprodan/charts/podinfo
      path: .
      targetRevision: 6.17.0
      helm:
        valueFiles:
          - values-prod.yaml
          - $values/apps/podinfo/values.yaml
    - repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true