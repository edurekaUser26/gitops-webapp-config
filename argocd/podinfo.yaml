---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  project: default
    source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.17.0
        helm:
      valueFiles:
        - values-prod.yaml
      valuesObject:
        redis:
          enabled: false
        ui:
          message: "Deployed by Argo CD"
          color: "#2e7d32"
      parameters:
        - name: replicaCount
          value: "2"
        - name: ui.message
          value: "Set by a parameter"
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true