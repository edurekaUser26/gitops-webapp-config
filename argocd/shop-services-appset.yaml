---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: shop-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
              revision: HEAD
              directories:
                - path: services/*
          - list:
              elements:
                - env: dev
                - env: prod
  template:
    metadata:
      name: "{{.path.basename}}-{{.env}}"
    spec:
      project: default
      sources:
        - repoURL: https://stefanprodan.github.io/podinfo
          chart: podinfo
          targetRevision: 6.17.0
          helm:
            releaseName: "{{.path.basename}}"
            valueFiles:
              - "$values/{{.path.path}}/values.yaml"
        - repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "shop-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          enabled: {{ ne .env "prod" }}