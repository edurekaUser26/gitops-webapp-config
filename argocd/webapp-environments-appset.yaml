---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: webapp-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          - env: prod
  template:
    metadata:
      name: webapp-{{.env}}
    spec:
      project: webapp-team
      source:
        repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
        targetRevision: HEAD
        path: apps/webapp-kustomize/overlays/{{.env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: webapp-{{.env}}
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true