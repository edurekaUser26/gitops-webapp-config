---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: webapp-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
        revision: HEAD
        directories:
          - path: apps/webapp-kustomize/overlays/*
  template:
    metadata:
      name: webapp-{{.path.basename}}
    spec:
      project: webapp-team
      source:
        repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: webapp-{{.path.basename}}
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true