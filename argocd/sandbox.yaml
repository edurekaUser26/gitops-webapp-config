---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edurekaUser26/gitops-webapp-config.git
    targetRevision: HEAD
    path: apps/sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox