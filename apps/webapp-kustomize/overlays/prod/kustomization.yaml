---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-prod
resources:
  - ../../base
images:
  - name: ghcr.io/edurekauser26/gitops-webapp
    newTag: 1.0.0
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: webapp-config
      data:
        APP_ENV: "production"