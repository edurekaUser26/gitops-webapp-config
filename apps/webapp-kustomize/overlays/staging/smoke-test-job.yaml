---
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: ghcr.io/edurekauser26/gitops-webapp:1.0.0
          command:
            - node
            - -e
            - |
              fetch("http://webapp").then(async (res) => {
                const body = await res.text();
                console.log(`Smoke test status ${res.status}: ${body.trim()}`);
                process.exit(res.ok ? 0 : 1);
              }).catch((err) => {
                console.error(`Smoke test failed: ${err.message}`);
                process.exit(1);
              });