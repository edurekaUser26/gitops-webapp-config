---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-staging
resources:
  - ../../base
  - db-migrate-job.yaml
  - smoke-test-job.yaml
images:
  - name: ghcr.io/edurekauser26/gitops-webapp
    newTag: 1.0.0
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: webapp
      spec:
        replicas: 2
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: webapp-config
      data:
        APP_ENV: "staging"