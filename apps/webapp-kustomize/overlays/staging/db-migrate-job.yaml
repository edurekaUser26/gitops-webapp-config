---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/edurekauser26/gitops-webapp:1.0.0
          command:
            - node
            - -e
            - |
              console.log("Running database migration...");
              setTimeout(() => console.log("Migration complete"), 3000);